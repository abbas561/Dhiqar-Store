<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
أقسام المنتجات - أمازون ذي قار
</title>


<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<div class="logo">
🛒 أمازون ذي قار
</div>

</header>



<nav>

<a href="index.html">
🏠 الرئيسية
</a>


<a href="products.html">
🛒 جميع المنتجات
</a>


<a href="categories.html">
📂 الأقسام
</a>


</nav>




<section class="categories-page">


<h2>
📂 الأقسام الرئيسية
</h2>


<div id="categories-box"
class="categories">

</div>



<h2 id="sub-title"
style="display:none">

الفروع

</h2>


<div id="subcategories-box"
class="categories">

</div>



<h2 id="products-title"
style="display:none">

المنتجات

</h2>


<div id="category-products"
class="products">

</div>



</section>






<script type="module">


import categories from "./categories.js";


import { loadProducts }
from "./script.js";





const categoriesBox =
document.getElementById("categories-box");


const subBox =
document.getElementById("subcategories-box");



const subTitle =
document.getElementById("sub-title");


const productsTitle =
document.getElementById("products-title");



const productsBox =
document.getElementById("category-products");







Object.keys(categories).forEach(cat=>{


categoriesBox.innerHTML += `


<button class="category-btn"
data-category="${cat}">


📦 ${cat}


</button>


`;



});







document.querySelectorAll(".category-btn")
.forEach(btn=>{


btn.onclick=function(){



let cat =
this.dataset.category;



subBox.innerHTML="";


productsBox.innerHTML="";



subTitle.style.display="block";


productsTitle.style.display="none";




categories[cat].forEach(sub=>{



subBox.innerHTML += `


<button class="subcategory-btn"
data-sub="${sub}"
data-cat="${cat}">


${sub}


</button>



`;



});




document.querySelectorAll(".subcategory-btn")
.forEach(subBtn=>{


subBtn.onclick=function(){


let sub =
this.dataset.sub;



productsTitle.style.display="block";


productsBox.innerHTML="";



loadProducts(
"category-products",
this.dataset.cat,
sub
);



};



});



};



});





</script>



</body>

</html>
