<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
إدارة المنتجات - أمازون ذي قار
</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<div class="logo">
🛒 إدارة أمازون ذي قار
</div>

</header>



<section class="categories">


<h2>
➕ إضافة / تعديل منتج
</h2>



<div class="category-box">


<input type="hidden" id="productId">


<input id="name"
placeholder="اسم المنتج">


<br><br>



<select id="category">

<option>
اختر القسم الرئيسي
</option>

</select>


<br><br>



<select id="subcategory">

<option>
اختر القسم الفرعي
</option>

</select>


<br><br>



<input id="price"
placeholder="السعر الحالي">

<br><br>

<input id="quantity"
placeholder="الكمية في المخزون"
type="number">


<br><br>


<input id="color"
placeholder="اللون">

<br><br>



<input id="oldPrice"
placeholder="السعر قبل الخصم">


<br><br>



<select id="status">

<option>
متوفر
</option>

<option>
عرض خاص
</option>

<option>
غير متوفر
</option>

</select>


<br><br>



<div class="file-box">


<label>
📷 اختر صورة المنتج
</label>


<br><br>


<input 
type="file"
id="imageFile1"
accept="image/*">

<br><br>

<input 
type="file"
id="imageFile2"
accept="image/*">

<br><br>

<input 
type="file"
id="imageFile3"
accept="image/*">



<div id="preview"
class="preview">

</div>


</div>


<br>



<textarea id="description"
placeholder="وصف المنتج"></textarea>


<br><br>



<button onclick="saveProduct()">

💾 حفظ المنتج

</button>


</div>


</section>
<section class="products">


<h2>
📦 المنتجات
</h2>



<input id="search"
placeholder="بحث..."
onkeyup="showProducts()">



<div id="admin-products"
class="products">

</div>


</section>





<script type="module">


import { initializeApp } 
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";

import {
getAuth,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";

import categories from "./categories.js";

import {

getFirestore,

collection,

getDocs,

addDoc,

updateDoc,

deleteDoc,

doc

}

from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";





const firebaseConfig = {


apiKey: "AIzaSyB6Xqmz-CMzvL0TS0Bn1cmNqmd8QdJVAuA",

authDomain: "dhiqar-store.firebaseapp.com",

projectId: "dhiqar-store",

storageBucket: "dhiqar-store.firebasestorage.app",

messagingSenderId: "218844146604",

appId: "1:218844146604:web:298a1a028d3c96c7e2a809"


};





const app = initializeApp(firebaseConfig);


const db = getFirestore(app);


const auth = getAuth(app);


onAuthStateChanged(auth,(user)=>{

if(!user){

window.location.href="login.html";

}

});


let data=[];


let selectedImages=[];





// تحميل الأقسام


const categorySelect =
document.getElementById("category");


const subcategorySelect =
document.getElementById("subcategory");




Object.keys(categories).forEach(cat=>{


let option =
document.createElement("option");


option.value=cat;


option.textContent=cat;


categorySelect.appendChild(option);


});





categorySelect.addEventListener(
"change",
()=>{


subcategorySelect.innerHTML="";



let first =
document.createElement("option");


first.textContent=
"اختر القسم الفرعي";


subcategorySelect.appendChild(first);




categories[categorySelect.value]
.forEach(sub=>{


let option =
document.createElement("option");


option.value=sub;


option.textContent=sub;


subcategorySelect.appendChild(option);


});



});





window.previewImage=function(event){


let file =
event.target.files[0];


if(!file)return;



let reader =
new FileReader();



reader.onload=function(e){


selectedImages.push(e.target.result);

document.getElementById("preview").innerHTML =
selectedImages.map(img =>
<img src="${img}" width="100">
).join("");



};



reader.readAsDataURL(file);



}

// قراءة المنتجات من Firebase

async function loadData(){

let snap =
await getDocs(collection(db,"products"));


data=[];


snap.forEach(item=>{


data.push({

id:item.id,

...item.data()

});


});


showProducts();


}





// حفظ المنتج

async function saveProduct(){


let id =
document.getElementById("productId").value;



let item={


name:
document.getElementById("name").value,


category:
document.getElementById("category").value,


subcategory:
document.getElementById("subcategory").value,


images:
selectedImages,


image:
selectedImage || "",


price:
document.getElementById("price").value,

quantity:
document.getElementById("quantity").value,


color:
document.getElementById("color").value,

oldPrice:
document.getElementById("oldPrice").value,


status:
document.getElementById("status").value,


description:
document.getElementById("description").value


};





if(id){


await updateDoc(
doc(db,"products",id),
item
);


}else{


await addDoc(
collection(db,"products"),
item
);


}



alert("تم حفظ المنتج في السحابة");


clearForm();


await loadData();


}



window.saveProduct=saveProduct;







// عرض المنتجات

async function showProducts(){


let box =
document.getElementById("admin-products");


let search =
document.getElementById("search")
.value
.toLowerCase();



box.innerHTML="";



data

.filter(p=>
p.name.toLowerCase().includes(search)
)

.forEach(p=>{


let img =
p.images && p.images.length
?
p.images[0]
:
"";



box.innerHTML += `

<div class="product-card">


<img src="${img}">


<h3>
${p.name}
</h3>


<p>
${p.price}
</p>



<button onclick="editProduct('${p.id}')">
✏️ تعديل
</button>



<button onclick="deleteProduct('${p.id}')">
🗑 حذف
</button>


</div>

`;



});


}



window.showProducts=showProducts;







window.editProduct=function(id){


let p =
data.find(x=>x.id==id);



if(!p)return;



document.getElementById("productId").value=p.id;

document.getElementById("name").value=p.name||"";


document.getElementById("category").value=p.category||"";

document.getElementById("subcategory").value=p.subcategory||"";


document.getElementById("price").value=p.price||"";

document.getElementById("quantity").value =
p.quantity || "";


document.getElementById("color").value =
p.color || "";

document.getElementById("oldPrice").value=p.oldPrice||"";


document.getElementById("status").value=p.status||"متوفر";


document.getElementById("description").value=p.description||"";


selectedImage =
p.images && p.images.length
?
p.images[0]
:
p.image || "";


document.getElementById("preview").innerHTML =
selectedImage
?
`<img src="${selectedImage}">`
:
"";


};







window.deleteProduct=async function(id){


if(confirm("هل تريد حذف المنتج؟")){


await deleteDoc(
doc(db,"products",id)
);


await loadData();


}


};






function clearForm(){


document
.querySelectorAll("input,textarea")
.forEach(e=>{


if(e.id!="search"
&&
e.id!="productId")

e.value="";


});


document.getElementById("preview").innerHTML="";


selectedImage="";


document.getElementById("productId").value="";


}





document.addEventListener(
"DOMContentLoaded",
()=>{


loadData();


});



</script>



</body>

</html>
