<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>
جميع المنتجات - أمازون ذي قار
</title>


<link rel="stylesheet" href="style.css">

</head>


<body>


<header>

<div class="logo">
🛒 أمازون ذي قار
</div>


</header>



<nav>

<a href="index.html">
🏠 الرئيسية
</a>


<a href="products.html">
🛒 جميع المنتجات
</a>


<a href="categories.html">
📂 الأقسام
</a>


</nav>





<section>


<h2 id="title">

🛒 جميع المنتجات

</h2>



<div id="products"
class="products">

</div>



</section>







<script type="module">


import { db } from "./firebase.js";


import {

collection,

getDocs

}

from "https://www.gstatic.com/firebasejs/12.18.0/firebase-firestore.js";





let box =
document.getElementById("products");



let params =
new URLSearchParams(
window.location.search
);



let category =
params.get("category");



let subcategory =
params.get("subcategory");





let title =
document.getElementById("title");







async function load(){


let items=[];



let snap =
await getDocs(
collection(db,"products")
);



snap.forEach(doc=>{


items.push({

id:doc.id,

...doc.data()

});


});






if(category){


items =
items.filter(p=>
p.category===category
);



title.innerHTML =
"📂 "+category;


}






if(subcategory){


items =
items.filter(p=>
p.subcategory===subcategory
);



title.innerHTML =
"📦 "+subcategory;


}






box.innerHTML="";




items.forEach(product=>{



let img =
product.images &&
product.images.length
?
product.images[0]
:
product.image || "";




box.innerHTML += `


<div class="product-card">


<img src="${img}">


<h3>
${product.name}
</h3>


<p>
${product.price}
</p>


<a href="product.html?id=${product.id}">
عرض المنتج
</a>



</div>



`;



});



}



load();



</script>



</body>

</html>
